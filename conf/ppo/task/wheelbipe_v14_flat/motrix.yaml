# @package _global_
defaults:
  - /task/wheelbipe_v14_flat/mujoco
  - _self_

training:
  task_name: WheelbipeV14Flat
  sim_backend: motrix

env:
  # Motrix currently requires the explicit closed-loop compatibility switch;
  # policy, reward, timing and source randomization semantics remain inherited.
  motrix_disable_equality: true
  render_offset_mode: zero
  domain_rand:
    joint_friction:
      viscous_backend_mode: unsupported_omitted

play_profile:
  enabled: true
  env:
    render_spacing: 2.0
