# @package _global_
# Mainline Real68 balance velocity-tracking profile:
# high forward speed + high yaw-rate tracking under balance constraints.
training:
  task_name: Real68BalanceFlat
  sim_backend: mujoco
  play_steps: 400

play_profile:
  enabled: true
  env:
    commands:
      vel_limit:
        - [-0.8, 0.0, -2.5]
        - [1.2, 0.0, 2.5]
      resampling_time: 1.5
      rel_standing_envs: 0.0
    command_curriculum:
      enabled: false
    domain_rand:
      randomize_init_yaw: true
      reset_qvel_limit: 0.10

algo:
  num_envs: 8192
  max_iterations: 800
  empirical_normalization: true
  obs_groups:
    actor:
      - actor
    critic:
      - critic
  policy:
    init_noise_std: 0.30
  algorithm:
    learning_rate: 1.0e-4
    entropy_coef: 5.0e-4

env:
  control_config:
    hip_velocity_scale: 5.0
    wheel_velocity_scale: 28.0
    calf_action_scale: 0.40
    hip_kd: 2.0
    wheel_kd: 0.45
    calf_kp: 50.0
    calf_kd: 4.0
  commands:
    vel_limit:
      - [-0.8, 0.0, -1.5]
      - [1.32, 0.0, 1.5]
    resampling_time: 1.5
    rel_standing_envs: 0.05
  command_curriculum:
    enabled: true
    initial_vel_limit:
      - [-0.8, 0.0, -1.5]
      - [1.32, 0.0, 1.5]
    final_vel_limit:
      - [-1.2, 0.0, -3.0]
      - [1.4, 0.0, 3.0]
    vx_step: 0.05
    vx_step_down: 0.10
    yaw_step: 0.02
    yaw_step_down: 0.05
    yaw_unlock_vx_progress: 0.0
    reverse_unlock_vx_progress: 0.25
    min_speed_ratio: 0.50
    min_speed_ratio_down: 0.25
    vx_error_range: [0.35, 0.55, 0.90]
    max_vx_error: 0.70
    max_wz_error: 0.75
    max_wz_error_high: 1.50
    max_tilt_rate: 0.015
    max_tilt_rate_high: 0.05
    max_tilt_angle_deg: 6.0
    max_tilt_angle_deg_high: 10.0
    max_height_violation_rate: 0.01
    max_height_violation_rate_high: 0.03
    max_nonwheel_contact_rate: 0.01
    max_nonwheel_contact_rate_high: 0.04
    min_segment_count: 96
    standing_bootstrap_enabled: false
    standing_prob_initial: 0.10
    standing_prob_final: 0.04
    standing_decay_vx_progress: 0.8
    straight_command_prob: 0.35
    yaw_only_command_prob: 0.20
    yaw_only_max_abs_vx: 0.08
    high_speed_command_prob: 0.35
    high_speed_min_abs_vx: 0.9
  height_command:
    # Height is command-relative because the physical robot has no height sensor.
    # Start with a conservative subset of the mechanical 0.20-0.32 m envelope.
    range: [0.22, 0.26]
    speed_lift_gain: 0.0
    max_speed_lift: 0.0
    observation_reference_height: 0.23
  domain_rand:
    randomize_ground_friction: true
    ground_friction_multiplier_range: [0.85, 1.15]
    randomize_base_mass: true
    added_mass_range: [-0.15, 0.15]
    random_com: true
    com_offset_x: [-0.01, 0.01]
    reset_qvel_limit: 0.10
  sensor:
    use_wheel_odometry: true
  recovery:
    enabled: true
    initial_base_height: 0.23
    initial_recovery_probability: 0.05
    final_recovery_probability: 0.20
    initial_roll_range: [-3.141592653589793, 3.141592653589793]
    initial_pitch_range: [-3.141592653589793, 3.141592653589793]
    orientation_curriculum: true
    initial_orientation_scale: 0.15
    in_episode_fall_recovery_progress: 0.75
    fall_detect_cos: 0.90
    upright_cos: 0.96
    upright_hold_seconds: 0.40
    timeout_seconds: 2.5
    final_timeout_seconds: 5.0
  termination_config:
    fall_termination: true
    nonwheel_contact_termination: true
    nonwheel_contact_threshold: 0.5
    nonwheel_contact_max_steps: 4

reward:
  scales:
    tracking_lin_vel: 0.8
    tracking_ang_vel: 0.5
    balanced_tracking_lin_vel: 2.6
    balanced_tracking_ang_vel: 1.8
    forward_progress: 1.1
    net_progress: 6.0
    under_speed: -3.0
    drive_wheel_command: 0.8
    reverse_motion: -2.5
    yaw_rate_when_uncommanded: -2.0
    heading_stability: -1.5
    lateral_drift: -1.2
    height_tracking: 0.5
    height_safety: -1.2
    orientation: -24.0
    tilt_termination: -25.0
    lin_vel_z: -2.0
    ang_vel_xy: -1.2
    posture: -0.10
    leg_symmetry: -0.30
    drive_action_symmetry: -0.15
    calf_action_symmetry: -1.2
    standing_lin_vel: -5.0
    standing_wheel_action: -1.0
    standing_under_height: -2.0
    standing_liangan5_contact: -8.0
    standing_orientation: -8.0
    standing_posture: -1.0
    standing_leg_symmetry: -1.5
    action_rate: -0.004
    torques: -0.0006
    joint_pos_penalty: -0.4
    joint_power: -2.0e-5
    nonwheel_contact: -3.0
    liangan5_contact: -3.0
    liangan5_contact_asymmetry: -4.0
    recovery_progress: 20.0
    recovery_upright: 4.0
    recovery_complete: 50.0
    alive: 0.10
  tracking_sigma: 0.30
  height_tracking_sigma: 0.03
  height_safety_margin: 0.025
  base_height_target: 0.23
  min_base_height: 0.16
  max_base_height: 0.40
  max_tilt_cos: 0.90
  command_lean:
    enabled: true
    gravity_x_gain: -0.06
    gravity_x_limit: 0.08
    hip_gain: 0.03
    hip_limit: 0.04
    calf_gain: 0.03
    calf_limit: 0.05
  balance_gate:
    enabled: true
    upright_cos_min: 0.80
    upright_cos_full: 0.96
    straight_command_yaw_threshold: 0.25
    moving_command_vx_threshold: 0.10
    heading_error_limit: 0.30
    lateral_drift_limit: 0.30
    yaw_tracking_sigma: 0.75
    standing_roll_pitch_sigma: 0.03
