# @package _global_
# Fine-tune profile for high-speed forward tracking after the standing/safe curriculum converges.
defaults:
  - /task/real68_balance_veltrack_flat/mujoco
  - _self_

algo:
  num_envs: 8192
  max_iterations: 30

env:
  commands:
    vel_limit:
      - [0.45, 0.0, 0.0]
      - [0.85, 0.0, 0.0]
    rel_standing_envs: 0.0
  command_curriculum:
    enabled: false

reward:
  scales:
    orientation: -14.0
    tilt_termination: -12.0
    ang_vel_xy: -0.8
  command_lean:
    gravity_x_gain: -0.10
    gravity_x_limit: 0.10

play_profile:
  env:
    commands:
      vel_limit:
        - [0.8, 0.0, 0.0]
        - [0.8, 0.0, 0.0]
      rel_standing_envs: 0.0
    command_curriculum:
      enabled: false
