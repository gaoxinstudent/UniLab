# @package _global_
# 10.4 closed-chain wheeled robot: flat-ground smoke training owner.
training:
  task_name: TenFourBalanceFlat
  sim_backend: mujoco
  play_env_num: 4
  play_steps: 240
  render_spacing: 0.0
  cam_distance: 2.4
  cam_elevation: -16.0
  cam_azimuth: 120.0
  cam_tracking: true
  cam_tracking_env_idx: 0
  cam_tracking_extra_envs: 0

interactive:
  action_mode: policy
  policy_obs_mode: auto
  camera_follow_body: true
  use_env_visual_model: true

algo:
  num_envs: 16
  num_steps_per_env: 24
  max_iterations: 3
  save_interval: 1
  runner_class_name: OnPolicyRunner
  num_one_step_obs: 28
  num_actor_history: 1
  num_critic_history: 1
  empirical_normalization: true
  obs_groups:
    actor:
      - actor
    critic:
      - critic
  policy:
    init_noise_std: 0.25
    actor_hidden_dims: [128, 128]
    critic_hidden_dims: [128, 128]
    activation: elu
  algorithm:
    learning_rate: 3.0e-4
    entropy_coef: 0.005
    num_mini_batches: 2
    num_learning_epochs: 2

env:
  scene:
    model_file: src/unilab/assets/robots/10_4/scene_flat.xml
  sim_dt: 0.001
  ctrl_dt: 0.02
  max_episode_seconds: 8.0
  adaptive_chunk_size: false
  chunk_size: 4
  mujoco_num_threads: 4
  observation_schema: ten_four_balance_v1
  action_schema: ten_four_direct_mixed_v1
  history:
    num_actor_history: 1
    num_critic_history: 1
  control_config:
    hip_velocity_scale: 4.0
    wheel_velocity_scale: 12.0
    calf_action_scale: 0.30
    hip_kd: 2.0
    wheel_kd: 0.45
    calf_kp: 45.0
    calf_kd: 3.0
  commands:
    vel_limit:
      - [-0.25, 0.0, -0.5]
      - [0.50, 0.0, 0.5]
    resampling_time: 2.0
    rel_standing_envs: 0.20
  command_curriculum:
    enabled: false
  domain_rand:
    randomize_init_yaw: false
    randomize_ground_friction: false
    randomize_base_mass: false
    random_com: false
    randomize_control_kp: false
    randomize_control_kd: false
    randomize_motor_strength: false
    randomize_action_delay: false
    push_robots: false
  domain_rand_curriculum:
    enabled: false
  sensor:
    use_wheel_odometry: true
  recovery:
    enabled: false
  cold_start:
    enabled: false
  termination_config:
    fall_termination: true
    nonwheel_contact_termination: true
    nonwheel_contact_threshold: 0.5
    nonwheel_contact_max_steps: 20

reward:
  scales:
    tracking_lin_vel: 1.0
    tracking_ang_vel: 0.2
    balanced_tracking_lin_vel: 0.5
    balanced_tracking_ang_vel: 0.2
    forward_progress: 0.2
    net_progress: 0.5
    under_speed: -0.5
    drive_wheel_command: 0.1
    yaw_rate_when_uncommanded: -0.1
    heading_stability: -0.1
    lateral_drift: -0.1
    height_tracking: 0.0
    height_safety: -1.0
    under_height: 0.0
    orientation: -4.0
    tilt_termination: -5.0
    lin_vel_z: -0.2
    ang_vel_xy: -0.1
    posture: -0.2
    leg_symmetry: -0.2
    drive_action_symmetry: -0.1
    calf_action_symmetry: -0.2
    standing_lin_vel: -0.5
    standing_wheel_action: -0.1
    standing_under_height: -1.0
    # Guide wheels are intentional support elements; their floor contact is
    # physically retained but must not be penalized during training.
    standing_liangan5_contact: 0.0
    standing_orientation: -1.0
    standing_posture: -0.5
    standing_leg_symmetry: -0.5
    action_rate: -0.002
    joint_pos_penalty: -0.05
    nonwheel_contact: -1.0
    nonwheel_contact_termination: -2.0
    liangan5_contact: 0.0
    liangan5_contact_asymmetry: 0.0
    alive: 0.05
  tracking_sigma: 0.30
  height_tracking_sigma: 0.02
  height_safety_margin: 0.02
  base_height_target: 0.257282
  min_base_height: 0.15
  max_base_height: 0.40
  max_tilt_cos: 0.80
  balance_gate:
    enabled: false
