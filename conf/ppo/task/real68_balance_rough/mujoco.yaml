# @package _global_
training:
  task_name: Real68BalanceRough
  sim_backend: mujoco
  play_steps: 40
  play_env_num: 16
  render_spacing: 0.0
  cam_tracking: true

interactive:
  action_mode: policy
  camera_follow_body: true

algo:
  num_envs: 1024
  max_iterations: 600
  empirical_normalization: true
  obs_groups:
    actor:
      - actor
    critic:
      - critic
  policy:
    init_noise_std: 0.35
  algorithm:
    learning_rate: 3.0e-4
    entropy_coef: 2.0e-3

env:
  scene:
    terrain:
      hfield_name: terrain_hfield
      geom_name: floor
      generator:
        seed: 42
        curriculum: true
        size: [8.0, 8.0]
        num_rows: 6
        num_cols: 6
        border_width: 20.0
  control_config:
    hip_velocity_scale: 5.0
    wheel_velocity_scale: 28.0
    calf_action_scale: 0.4
    hip_kd: 2.0
    wheel_kd: 0.45
    calf_kp: 50.0
    calf_kd: 4.0
  commands:
    vel_limit:
      - [-1.2, 0.0, -3.0]
      - [1.4, 0.0, 3.0]
    resampling_time: 3.0
    rel_standing_envs: 0.0
  command_curriculum:
    enabled: true
    initial_vel_limit:
      - [0.1, 0.0, -0.3]
      - [0.35, 0.0, 0.3]
    final_vel_limit:
      - [-1.2, 0.0, -3.0]
      - [1.4, 0.0, 3.0]
    vx_step: 0.03
    yaw_step: 0.02
    update_interval_logs: 6
    min_speed_ratio: 0.45
    max_vx_error: 0.25
    max_wz_error: 0.9
    yaw_unlock_vx_progress: 0.25
    reverse_unlock_vx_progress: 0.6
    terrain_unlock_vx_progress: 0.35
    straight_command_prob: 0.30
    yaw_only_command_prob: 0.20
    yaw_only_max_abs_vx: 0.08
    high_speed_command_prob: 0.25
    high_speed_min_abs_vx: 0.8
  height_command:
    range: [0.22, 0.26]
    speed_lift_gain: 0.0
    max_speed_lift: 0.0
    observation_reference_height: 0.23
  terrain_scan:
    enabled: true
    hfield_name: terrain_hfield
    geom_name: floor
  termination_config:
    terrain_out_of_bounds: true
    terrain_distance_buffer: 3.0
    fall_termination: true
    min_up_proj: 0.2
    min_base_height: 0.12
    nonwheel_contact_termination: true
    nonwheel_contact_threshold: 0.5
    nonwheel_contact_max_steps: 8
  terrain_curriculum:
    enabled: true
    promote_frac: 0.2
  domain_rand:
    reset_roll_range: [-0.05, 0.05]
    reset_pitch_range: [-0.05, 0.05]
    reset_yaw_range: [-3.141592653589793, 3.141592653589793]
    reset_height_offset_range: [0.0, 0.04]
    reset_qvel_limit: 0.15
    randomize_ground_friction: true
    ground_friction_multiplier_range: [0.85, 1.15]
    randomize_base_mass: true
    added_mass_range: [-0.15, 0.15]
    random_com: true
    com_offset_x: [-0.01, 0.01]
    push_robots: false
    push_interval: 625
    max_force: [0.8, 0.8, 0.4]
    push_body_name: base_link
  sensor:
    use_wheel_odometry: true
  recovery:
    enabled: true
    initial_base_height: 0.23
    initial_recovery_probability: 0.03
    final_recovery_probability: 0.15
    initial_roll_range: [-3.141592653589793, 3.141592653589793]
    initial_pitch_range: [-3.141592653589793, 3.141592653589793]
    orientation_curriculum: true
    initial_orientation_scale: 0.15
    in_episode_fall_recovery_progress: 0.75
    fall_detect_cos: 0.90
    upright_cos: 0.96
    upright_hold_seconds: 0.40
    timeout_seconds: 2.5
    final_timeout_seconds: 5.0

reward:
  scales:
    tracking_lin_vel: 0.6
    tracking_ang_vel: 0.4
    balanced_tracking_lin_vel: 2.0
    balanced_tracking_ang_vel: 1.2
    forward_progress: 1.5
    net_progress: 2.0
    under_speed: -1.5
    drive_wheel_command: 0.4
    yaw_rate_when_uncommanded: -1.0
    height_tracking: 0.5
    orientation: -10.0
    lin_vel_z: -2.0
    ang_vel_xy: -0.2
    posture: -0.05
    leg_symmetry: -0.3
    action_rate: -0.003
    torques: -0.0005
    wheel_vel: -0.0002
    joint_pos_penalty: -1.0
    joint_power: -2.0e-5
    nonwheel_contact: -3.0
    recovery_progress: 20.0
    recovery_upright: 4.0
    recovery_complete: 50.0
    alive: 0.10
  tracking_sigma: 0.30
  height_tracking_sigma: 0.02
  base_height_target: 0.23
  min_base_height: 0.18
  max_base_height: 0.40
  max_tilt_cos: 0.35
  command_lean:
    enabled: true
    gravity_x_gain: -0.05
    gravity_x_limit: 0.07
    hip_gain: 0.025
    hip_limit: 0.035
    calf_gain: 0.025
    calf_limit: 0.045
  balance_gate:
    enabled: true
    upright_cos_min: 0.78
    upright_cos_full: 0.95
    straight_command_yaw_threshold: 0.25
    moving_command_vx_threshold: 0.08
    yaw_tracking_sigma: 0.75
