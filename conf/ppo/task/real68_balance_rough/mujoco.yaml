# @package _global_
training:
  task_name: Real68BalanceRough
  sim_backend: mujoco
  play_steps: 400
  play_env_num: 16
  render_spacing: 0.0
  cam_tracking: true

interactive:
  action_mode: policy
  camera_follow_body: true

algo:
  num_envs: 1024
  max_iterations: 600
  empirical_normalization: true
  obs_groups:
    actor:
      - actor
    critic:
      - critic
  policy:
    init_noise_std: 0.5
  algorithm:
    learning_rate: 3.0e-4
    entropy_coef: 2.0e-3

env:
  scene:
    terrain:
      hfield_name: terrain_hfield
      geom_name: floor
      generator:
        seed: 42
        curriculum: true
        size: [8.0, 8.0]
        num_rows: 6
        num_cols: 6
        border_width: 20.0
  control_config:
    hip_velocity_scale: 5.0
    wheel_velocity_scale: 16.0
    calf_action_scale: 0.3
    hip_kd: 2.0
    wheel_kd: 0.9
    calf_kp: 40.0
    calf_kd: 3.0
  commands:
    vel_limit:
      - [-0.15, 0.0, -0.1]
      - [0.3, 0.0, 0.1]
    resampling_time: 3.0
    rel_standing_envs: 0.0
  height_command:
    range: [0.199, 0.35]
  terrain_scan:
    enabled: true
    hfield_name: terrain_hfield
    geom_name: floor
  termination_config:
    terrain_out_of_bounds: true
    terrain_distance_buffer: 3.0
    fall_termination: true
    min_up_proj: 0.2
    min_base_height: 0.12
    nonwheel_contact_termination: true
    nonwheel_contact_threshold: 0.5
    nonwheel_contact_max_steps: 8
  terrain_curriculum:
    enabled: true
  domain_rand:
    reset_roll_range: [-0.1, 0.1]
    reset_pitch_range: [-0.1, 0.1]
    reset_yaw_range: [-3.141592653589793, 3.141592653589793]
    reset_height_offset_range: [0.0, 0.08]
    reset_qvel_limit: 0.15
    randomize_ground_friction: false
    ground_friction_multiplier_range: [0.85, 1.15]
    randomize_base_mass: false
    added_mass_range: [-0.5, 0.5]
    random_com: false
    com_offset_x: [-0.03, 0.03]
    push_robots: false
    push_interval: 625
    max_force: [0.8, 0.8, 0.4]
    push_body_name: base_link

reward:
  scales:
    tracking_lin_vel: 3.0
    tracking_ang_vel: 1.0
    height_tracking: 0.5
    orientation: -3.5
    lin_vel_z: -2.0
    ang_vel_xy: -0.2
    posture: -0.05
    leg_symmetry: -0.2
    action_rate: -0.003
    torques: -0.0005
    wheel_vel: -0.0002
    joint_pos_penalty: -1.0
    joint_power: -2.0e-5
    nonwheel_contact: -2.0
    alive: 0.1
  tracking_sigma: 0.5
  height_tracking_sigma: 0.02
  base_height_target: 0.257282
  min_base_height: 0.18
  max_base_height: 0.40
  max_tilt_cos: 0.35
