# @package _global_
training:
  task_name: WheelbipeV14FlatHIM
  sim_backend: motrix
algo:
  algorithm_name: him
  num_actor_history: 5
  num_estimate: 4
  num_costs: 0
  estimator:
    velocity_target_start: 28
    target_obs_start: 4
env:
  noise_config:
    level: 1.0
    scale_joint_angle: 0.025
    scale_joint_vel: 1.0
    scale_gyro: 0.25
    scale_gravity: 0.05
    scale_wheel_vel: 1.0
  # Must remain identical to the MuJoCo owner: curriculum state changes the
  # reward graph and policy trajectory, not only backend physics.
  him_curriculum:
    enabled: true
    reward_key: track_height_exp
    num_steps_per_env: 24
    window_size: 64
    min_stage_episodes: 64
    normalize_by_episode_length: true
    restore_defaults_after_final_threshold: true
    assist_apply_on_compute: true
    assist_body_name: base_link
    force_interaction: shared_wrench_buffer_overwrite
    reward_stage_weights:
      - {track_height_exp: 1.0, track_height_exp_tight: 1.0}
      - {track_height_exp: 0.8, track_height_exp_tight: 0.6}
    assist_force_z_stages: [160.0, 80.0, 0.0]
    thresholds: [0.4, 0.4]
    stage_min_episodes: [500, 500]
  motrix_disable_equality: true
  domain_rand:
    joint_friction:
      viscous_backend_mode: unsupported_omitted
  # Compact source-like owner timing: 20 ms policy control, four 5 ms
  # physics substeps.  This is timing-only and does not claim source dynamics.
  sim_dt: 0.005
  ctrl_dt: 0.02
  delay_profile: source_v14_physics
  delay_range_semantics: exclusive
  use_obs_delay: true
  obs_delay_step_unit: physics
  obs_history_len: 10
  obs_default_time_lag: 1
  obs_delay_cfg:
    root_ang_vel_b: [1, 4]
    projected_gravity_b: [1, 4]
    joint_pos: [1, 4]
    joint_vel: [1, 4]
  use_act_delay: true
  act_history_len: 5
  act_delay_cfg:
    leg_actions: [1, 3]
    wheel_actions: [1, 3]
  control_config:
    leg_torque_limit: 40.0
    wheel_torque_limit: 5.0
