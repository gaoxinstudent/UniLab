# @package _global_
training:
  task_name: WheelbipeV14FlatNP3OBarlow
  sim_backend: motrix
algo:
  algorithm_name: np3o
  num_actor_history: 10
  num_estimate: 4
  num_costs: 5
env:
  noise_config:
    level: 1.0
    scale_joint_angle: 0.025
    scale_joint_vel: 1.0
    scale_gyro: 0.25
    scale_gravity: 0.05
    scale_wheel_vel: 1.0
  num_costs: 5
  vel_height_gate_enabled: true
  vel_height_gate_mode: linear_band
  vel_height_gate_full_error: 0.05
  vel_height_gate_zero_error: 0.10
  vel_height_gate_tracker_sigma: 0.02
  motrix_disable_equality: true
  domain_rand:
    joint_friction:
      viscous_backend_mode: unsupported_omitted
  np3o_tilt_limit_deg: 20.0
  # Compact source-like owner timing: 20 ms policy control, four 5 ms
  # physics substeps.  This is timing-only and does not claim source dynamics.
  sim_dt: 0.005
  ctrl_dt: 0.02
  delay_profile: source_v14_physics
  delay_range_semantics: exclusive
  use_obs_delay: true
  obs_delay_step_unit: physics
  obs_history_len: 10
  obs_default_time_lag: 1
  obs_delay_cfg:
    root_ang_vel_b: [1, 4]
    projected_gravity_b: [1, 4]
    joint_pos: [1, 4]
    joint_vel: [1, 4]
  use_act_delay: true
  act_history_len: 5
  act_delay_cfg:
    leg_actions: [1, 3]
    wheel_actions: [1, 3]
  control_config:
    leg_torque_limit: 40.0
    wheel_torque_limit: 5.0
