# @package _global_
training:
  task_name: WheelbipeV14FlatDreamWaQ
  sim_backend: motrix
algo:
  algorithm_name: dreamwaq
  num_actor_history: 5
  num_estimate: 4
  num_costs: 0
  policy:
    # Source AdaBoot is opt-in.  ``reward_cv``/``hybrid`` are validated and
    # fed by DreamWaQPPO's rolling episode-return window; ``off`` preserves
    # the default fixed representation path.
    adaboot_mode: "off"
    adaboot_min: 0.0
    adaboot_max: 1.0
    adaboot_temperature: 1.0
    adaboot_bias: 0.0
  algorithm:
    adaboot_reward_window_size: 1024
    adaboot_reward_cv_scale: 0.25
    adaboot_reward_cv_offset: 0.0
    adaboot_pboot_min: 0.0
    adaboot_pboot_max: 1.0
env:
  noise_config:
    level: 1.0
    scale_joint_angle: 0.025
    scale_joint_vel: 1.0
    scale_gyro: 0.25
    scale_gravity: 0.05
    scale_wheel_vel: 1.0
  motrix_disable_equality: true
  domain_rand:
    joint_friction:
      viscous_backend_mode: unsupported_omitted
  # Compact source-like owner timing: 20 ms policy control, four 5 ms
  # physics substeps.  This is timing-only and does not claim source dynamics.
  sim_dt: 0.005
  ctrl_dt: 0.02
  delay_profile: source_v14_physics
  delay_range_semantics: exclusive
  use_obs_delay: true
  obs_delay_step_unit: physics
  obs_history_len: 10
  obs_default_time_lag: 1
  obs_delay_cfg:
    root_ang_vel_b: [1, 4]
    projected_gravity_b: [1, 4]
    joint_pos: [1, 4]
    joint_vel: [1, 4]
  use_act_delay: true
  act_history_len: 5
  act_delay_cfg:
    leg_actions: [1, 3]
    wheel_actions: [1, 3]
  control_config:
    leg_torque_limit: 40.0
    wheel_torque_limit: 5.0
