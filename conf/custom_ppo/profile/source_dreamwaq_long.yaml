# @package _global_
# Source WheelBipe ``WheelbipeV14FlatDreamWaqPPORunnerCfg`` profile.
#
# Compose with ``task=wheelbipe_v14_flat_dreamwaq/<backend>``.  These values
# reproduce the checked-in source runner's long-run budget and network widths;
# they do not assert Isaac asset/dynamics parity for the UniLab compact env.
algo:
  algorithm_name: dreamwaq
  num_envs: 4096
  num_steps_per_env: 24
  max_iterations: 10000
  save_interval: 500
  num_actor_history: 5
  history_reset_mode: source_zero_current
  num_estimate: 4
  policy:
    actor_hidden_dims: [512, 256, 128]
    critic_hidden_dims: [512, 256, 128]
    cenet_encoder_hidden_dims: [256, 128, 64]
    cenet_decoder_hidden_dims: [64, 128, 256]
  algorithm:
    value_loss_coef: 4.0
    use_clipped_value_loss: true
    clip_param: 0.2
    entropy_coef: 0.005
    num_learning_epochs: 5
    num_mini_batches: 4
    learning_rate: 1.0e-4
    vae_learning_rate: 1.0e-3
    num_adaptation_module_substeps: 1
    kl_weight: 1.0
    schedule: adaptive
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.01
    max_grad_norm: 1.0
    adaboot_reward_window_size: 1024
    adaboot_reward_cv_scale: 0.25
    adaboot_reward_cv_offset: 0.0
    adaboot_pboot_min: 0.0
    adaboot_pboot_max: 1.0
