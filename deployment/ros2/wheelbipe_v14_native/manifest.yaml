schema_version: 1
bundle:
  id: wheelbipe_v14_native_ros2
  source_repository: scutrobotlab/wheelbipe_ros2_sim2sim
  source_revision: daa34f54d56cab91b3989d8152a7ce7b61092994
  source_license: MIT
  license_file: deployment/ros2/wheelbipe_v14_native/LICENSE
  license_sha256: eb6e10b4ac49a0e424b4a648b5f66ee9053d4eb60d5a602f120c0064adfee98b
  ros_distribution: humble
  source_root: deployment/ros2/wheelbipe_v14_native/src
  source_file_count: 72
  source_tree_sha256: 67f0628533f6f8cc849159426fe6769636c304ab4596d34cbfeed4a2f4e53b27

# These are colcon package source directories.  They are static source, not
# evidence that a ROS graph was built, sourced, launched, or hardware-tested.
packages:
  template_ros2_controller: controllers/template_ros2_controller
  mujoco_ros2_control: interfaces/mujoco_bridge
  real_bridge: interfaces/real_bridge
  template_middleware: middlewares/template_middleware
  robot_descriptions: resources/robot_descriptions
  keyboard_teleop: tools/keyboard_teleop
  xbox_teleop: tools/xbox_teleop

controller_manager_contract:
  namespace: wheelbipe_V14
  manager: /wheelbipe_V14/controller_manager
  update_rate_hz: 500
  spawners: [joint_state_broadcaster, template_ros2_controller]
  controller_type: robot_locomotion/TemplateRos2Controller
  joints:
    - left_front1_joint
    - left_rear1_joint
    - right_front1_joint
    - right_rear1_joint
    - left_wheel_joint
    - right_wheel_joint
    - left_spring2_joint
    - right_spring2_joint
  command_interfaces: [position, velocity, effort, kp, kd]
  state_interfaces: [position, velocity, effort]
  sensors: [imu]
  supported_backends: [sim, real]

plugins:
  - package: template_ros2_controller
    descriptor: controllers/template_ros2_controller/template_ros2_controller_plugin.xml
    cmake: controllers/template_ros2_controller/CMakeLists.txt
    category: controller_interface
    library: template_ros2_controller
    name: robot_locomotion/TemplateRos2Controller
    type: robot_locomotion::TemplateRos2Controller
    base_class_type: controller_interface::ControllerInterface
  - package: real_bridge
    descriptor: interfaces/real_bridge/real_bridge_plugin.xml
    cmake: interfaces/real_bridge/CMakeLists.txt
    category: hardware_interface
    library: real_bridge
    name: template_real_ros2_ctrl::RealBridge
    type: template_real_ros2_ctrl::RealBridge
    base_class_type: hardware_interface::SystemInterface
  - package: mujoco_ros2_control
    descriptor: interfaces/mujoco_bridge/mujoco_system_plugins.xml
    cmake: interfaces/mujoco_bridge/CMakeLists.txt
    category: mujoco_ros2_control
    library: mujoco_system_plugins
    name: mujoco_ros2_control/MujocoSystem
    type: mujoco_ros2_control::MujocoSystem
    base_class_type: mujoco_ros2_control::MujocoSystemInterface

launch_files:
  - middlewares/template_middleware/launch/template_bring_up.launch.py
  - interfaces/mujoco_bridge/launch/mujoco_bridge.launch.py
  - tools/keyboard_teleop/launch/keyboard_teleop.launch.py
  - tools/xbox_teleop/launch/xbox_teleop.launch.py

config_files:
  - middlewares/template_middleware/config/wheelbipe_V14.yaml
  - controllers/template_ros2_controller/config/template_ros2_controller_parameters.yaml
  - tools/keyboard_teleop/config/keyboard_teleop_params.yaml
  - tools/xbox_teleop/config/xbox_teleop_params.yaml

host_rules:
  - path: deployment/ros2/wheelbipe_v14_native/udev/99-wheelbipe-serial.rules
    sha256: 2f6487dfba1176d04465be1c83c6a06ebf3b79b53d319560ebbea486f0e75cf7
    installed: false
  - path: deployment/ros2/wheelbipe_v14_native/udev/99-wheelbipe-gamepad.rules
    sha256: 343e4a23b25581c2b48ad7cf744d17817f6fab7a79a53845e168cbc63855e540
    installed: false

# Binary source assets already live in UniLab with their provenance notices.
# The cold-path materializer copies them into a new colcon workspace; the
# checked-in native source tree therefore does not duplicate about 19 MiB of
# mesh data or the normal 35D ONNX policy.
asset_overlays:
  - kind: file
    source: src/unilab/assets/policies/wheelbipe_v14/V14-35-flat-and-rotation-13k.onnx
    destination: controllers/template_ros2_controller/policy/parallel/V14-35-flat-and-rotation-13k.onnx
    sha256: a1244761f7ede02f8c80d076d4315a25f014df43df3f7f0d20c2ca5bcd518719
  - kind: directory_glob
    source: src/unilab/assets/robots/wheelbipe_v14_2/meshes
    destination: resources/robot_descriptions/wheelbipeV14_2/meshes
    pattern: "*.STL"
    file_count: 21
    tree_sha256: 7d6a50b4b4198709df0250a8cfc2414b118befa4ff8111d6b26bd0e5c36fe1c3

native_runtime:
  dependency_lock: deployment/ros2/wheelbipe_v14_native/dependencies.lock
  dependency_lock_sha256: 620e4c631fc0ec33972ac979f6f599f184cf1438a8615374d09ffd5fb4192a20
  python_modules: [rclpy, launch, launch_ros, ament_index_python]
  platform: linux-x86_64
  executables: [ros2, colcon, xacro, cmake, g++, pkg-config, rosdep]
  ros_packages:
    - controller_manager
    - joint_state_broadcaster
    - robot_state_publisher
    - hardware_interface
    - pluginlib
    - generate_parameter_library
  optional_dependency_boundary: >-
    ROS 2 Humble, ros2_control, pluginlib, ONNX Runtime C++, MuJoCo 3.5.0,
    and their system dependencies are not installed or launched by UniLab.

serial_contract:
  plugin: template_real_ros2_ctrl::RealBridge
  port: /dev/wheelbipe_h7
  baudrate: 2000000
  reconnect_interval_ms: 1000
  stale_state_timeout_ms: 100
  joint_count: 8
  communicated_joint_count: 6
  sensors: [imu, dt7]
  output_gate: active_and_connected_and_fresh_valid_state
  deactivate_safe_stop: true
  realtime_transport: false

teleop_contract:
  topics:
    motion: /wheelbipe_V14/motion_command
    height: /wheelbipe_V14/height_command
    state: /wheelbipe_V14/state_command
    current_state: /wheelbipe_V14/current_state
  qos: {history: keep_last, depth: 1, reliability: best_effort, durability: volatile}
  keyboard:
    motion_keys: {forward: w, backward: s, left: a, right: d, stop: space}
    height_keys: {up: t, down: g, reset: r}
    state_keys: {INIT: "0", IDLE: "1", PREPARE: "2", RL: "3"}
    exit_key: x
    stdin_must_be_tty: true
  xbox:
    device_api: linux_evdev
    reconnect_interval_ms: 1000
    start_button_code: 315
    record_button_code: 167
    axes: {linear_x: 1, angular_z: 3, height_down: 2, height_up: 5}
    disconnect_behavior: immediate_zero_motion_and_clear_axes

claims:
  source_packaged: true
  native_ros2_active: false
  ros_graph_created: false
  serial_device_opened: false
  hardware_validated: false
  realtime_guarantee: false
